# Render.com 一键部署配置
# 使用方法：在Render.com导入此GitHub仓库即可自动部署
# 此版本包含所有问题修复：
# - 修复注册登录功能
# - 修复所有中文乱码问题（可视化和PDF报告）
# - 修复风险趋势图显示不全问题
# - 添加完整ADNI图像数据支持

services:
  - type: web
    name: alzheimer-diagnostic-system
    env: python
    plan: free
    region: singapore
    buildCommand: |
      pip install --upgrade pip && 
      pip install -r requirements.txt && 
      mkdir -p data results reports uploaded_img temp demodata logs static/fonts && 
      python -c "
import os, urllib.request, sys
os.makedirs('static/fonts', exist_ok=True)
font_path = 'static/fonts/NotoSansCJKsc-Regular.otf'
font_path_ttf = 'static/fonts/NotoSansCJKsc-Regular.ttf'
if not os.path.exists(font_path) and not os.path.exists(font_path_ttf):
    # 多个备用下载地址
    urls = [
        'https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf',
        'https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf',
        'https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf',
        'https://github.com/googlefonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf',
    ]
    for url in urls:
        try:
            print(f'尝试下载字体: {url}')
            urllib.request.urlretrieve(url, font_path)
            size = os.path.getsize(font_path)
            if size > 100000:
                print(f'字体下载成功: {size} bytes ({font_path})')
                break
            else:
                os.remove(font_path)
                print(f'下载文件太小，尝试下一个地址')
        except Exception as e:
            print(f'下载失败: {e}')
            continue
    else:
        print('所有字体下载地址均失败，中文可能显示为乱码')
else:
    print('字体文件已存在，跳过下载')
" &&
      python -m src.database.init_db
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT --workers $WORKERS
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: sqlite:///./alzheimer.db
      - key: WORKERS
        value: "2"
    autoDeploy: true