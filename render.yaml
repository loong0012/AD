# Render.com 一键部署配置
# v3.4.0 - 彻底修复PDF中文乱码（统一字体名ChineseFont） + 数据管理动态扫描文件系统

services:
  - type: web
    name: alzheimer-diagnostic-system
    env: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && mkdir -p data results reports uploaded_img temp demodata logs static/fonts && python build_font.py && python -m src.database.init_db
    startCommand: python pre_start.py && uvicorn src.app:app --host 0.0.0.0 --port $PORT --workers $WORKERS
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: sqlite:///./alzheimer.db
      - key: WORKERS
        value: "2"
      - key: MPLBACKEND
        value: "Agg"
    autoDeploy: true