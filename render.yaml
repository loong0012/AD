# Render.com 一键部署配置
# 使用方法：在Render.com导入此GitHub仓库即可自动部署

services:
  - type: web
    name: alzheimer-diagnostic-system
    env: python
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt && pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu && mkdir -p data results reports uploaded_img temp demodata logs
    startCommand: uvicorn src.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        value: sqlite:///./alzheimer.db
      - key: WORKERS
        value: "2"
    autoDeploy: true