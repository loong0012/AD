name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'staging'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short --cov=src --cov-report=xml || true

    - name: Upload coverage to Codecov
      if: hashFiles('coverage.xml') != ''
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Lint code
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      id: docker_login
      uses: docker/login-action@v3
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ secrets.DOCKERHUB_USERNAME || 'alzheimer-diagnostic-system' }}/alzheimer-diagnostic-system
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        load: ${{ github.event_name == 'pull_request' }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL || 'https://staging.alzheimer.example.com' }}

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Staging
      run: |
        echo "部署到预发布环境..."
        if [ -n "${{ secrets.STAGING_HOST }}" ]; then
          echo "通过SSH部署到 ${{ secrets.STAGING_HOST }}"
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} "cd /opt/alzheimer-diagnostic-system && docker-compose pull && docker-compose up -d"
        else
          echo "未配置STAGING_HOST，跳过远程部署"
        fi

    - name: Health check
      if: vars.STAGING_URL != ''
      run: |
        echo "执行健康检查..."
        for i in 1 2 3 4 5; do
          if curl -f -s -o /dev/null ${{ vars.STAGING_URL }}/health; then
            echo "健康检查通过!"
            exit 0
          fi
          echo "等待服务就绪... ($i/5)"
          sleep 10
        done
        echo "健康检查失败"
        exit 1

  deploy-production:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://alzheimer.example.com' }}

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Production
      run: |
        echo "部署到生产环境..."
        if [ -n "${{ secrets.PRODUCTION_HOST }}" ]; then
          echo "通过SSH部署到 ${{ secrets.PRODUCTION_HOST }}"
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} "cd /opt/alzheimer-diagnostic-system && docker-compose -f docker-compose.production.yml pull && docker-compose -f docker-compose.production.yml up -d"
        else
          echo "未配置PRODUCTION_HOST，跳过远程部署"
        fi

    - name: Health check
      if: vars.PRODUCTION_URL != ''
      run: |
        echo "执行健康检查..."
        for i in 1 2 3 4 5; do
          if curl -f -s -o /dev/null ${{ vars.PRODUCTION_URL }}/health; then
            echo "健康检查通过!"
            exit 0
          fi
          echo "等待服务就绪... ($i/5)"
          sleep 10
        done
        echo "健康检查失败"
        exit 1

    - name: Notify success
      if: success()
      run: |
        echo "部署成功! 环境: ${{ vars.PRODUCTION_URL || 'production' }}"

    - name: Notify failure
      if: failure()
      run: |
        echo "部署失败! 请检查日志"